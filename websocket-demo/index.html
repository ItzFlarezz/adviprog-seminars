<!doctype html>
<html lang="en">
	<head>
		<title>WebSocket Demo</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				max-width: 600px;
				margin: 0 auto;
				padding: 20px;
			}
			#messages {
				height: 300px;
				border: 1px solid #ccc;
				overflow-y: auto;
				padding: 10px;
				margin-bottom: 10px;
			}
			.message {
				margin: 5px 0;
			}
		</style>
	</head>
	<body>
		<h1>WebSocket demo</h1>
		<div id="status">Connecting to server...</div>
		<div id="messages"></div>
		<div>
			<input
				type="text"
				id="messageInput"
				placeholder="Type your message"
			/>
			<button onclick="sendMessage()">Send</button>
		</div>

		<script>
			const status = document.getElementById("status");
			const messages = document.getElementById("messages");
			const messageInput = document.getElementById("messageInput");

			// Ask the user for a name before connecting
			const username = prompt("Enter your chat name:") || "Anon";

			// Connect to the WebSocket server
			const ws = new WebSocket("ws://localhost:8080");

			ws.onopen = () => {
				status.textContent = `Connected as ${username}`;
				status.style.color = "green";

				// Optional: Announce to the room that someone joined
				ws.send(`* ${username} has joined the chat *`);
			};

			ws.onmessage = (event) => {
				const message = document.createElement("div");
				message.className = "message";
				message.textContent = event.data;
				messages.appendChild(message);
				messages.scrollTop = messages.scrollHeight; // Auto-scroll to bottom
			};

			ws.onerror = (error) => {
				status.textContent = "Error connecting to server";
				status.style.color = "red";
			};

			ws.onclose = () => {
				status.textContent = "Disconnected from server";
				status.style.color = "red";
			};

			function sendMessage() {
				const text = messageInput.value.trim();
				if (text) {
					const fullMessage = `${username}: ${text}`;

					// 1. Send the message to the server
					ws.send(fullMessage);

					// 2. Display the message on our OWN screen immediately
					const messageDiv = document.createElement("div");
					messageDiv.className = "message";
					messageDiv.textContent = fullMessage;

					// Optional: Make your own messages stand out (e.g., bold or colored)
					messageDiv.style.fontWeight = "bold";

					messages.appendChild(messageDiv);
					messages.scrollTop = messages.scrollHeight;

					// 3. Clear the input
					messageInput.value = "";
				}
			}

			messageInput.addEventListener("keypress", (e) => {
				if (e.key === "Enter") {
					sendMessage();
				}
			});
		</script>
	</body>
</html>
