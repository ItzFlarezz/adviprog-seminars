<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Tailwind — Pricing card</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { height: 100%; margin: 0; display: flex; align-items: center; justify-content: center; background: transparent; }
</style>
</head>
<body>

  <div class="bg-white rounded-xl shadow-lg p-6 w-72">
    <h3 class="text-xl font-bold text-slate-900">Pricing plan</h3>
    <p class="mt-2 text-slate-500">Everything you need for a weekend project.</p>
    <button class="mt-4 bg-sky-500 hover:bg-sky-600 text-white font-semibold px-4 py-2 rounded-lg transition-colors">
      Save
    </button>
  </div>

</body>
</html>
