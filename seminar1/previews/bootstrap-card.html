<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Bootstrap — Pricing card</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; display: flex; align-items: center; justify-content: center; background: transparent; }
</style>
</head>
<body>

  <div class="card border-0 shadow-lg p-4" style="width: 18rem;">
    <h3 class="card-title fw-bold fs-4">Pricing plan</h3>
    <p class="card-text text-secondary">Everything you need for a weekend project.</p>
    <button class="btn btn-primary rounded-pill px-3">Save</button>
  </div>

</body>
</html>
